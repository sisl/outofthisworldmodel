# wandb Bayesian sweep over the TERMINAL-SHAPING REWARD WEIGHTS, not the
# optimiser: PPO's hyperparameters are pinned at the ppo_tuned winners and
# what is searched is how hard the proximity/alignment bonuses and the
# effort cost need to pull to turn the near-shell standoff behaviour into
# an arrival (conf/environments/iss_numerical_ports_progress_1hz_near_
# terminal.yaml documents why those terms exist).
#
#   just sweep-init ppo_terminal          # prints the sweep id
#   just sweep-agent <id> ppo_terminal    # one agent, CPU only
#
# NEEDS the owm-envs branch de/terminal-shaping (RewardWeights.proximity/
# alignment/effort); trials on the older pin die at env construction.
#
# SCORED ON CLOSURE, NOT RETURN. Every trial flies a different reward, so
# mean return ranks the prices rather than the flying; sweep/
# eval_safe_min_pos_m is the reward-independent objective sweep_callbacks
# keeps for exactly this case. Its known blind spot applies here: it
# measures how close a trial gets and not the attitude it arrives with, so
# the finished sweep is read on sweep/eval_min_att_rad and
# sweep/final_success beside the objective, not on the objective alone.
#
# 0.0 IS IN EVERY NEW RANGE. proximity=alignment=effort=0 is exactly the
# reward the published baselines trained on, so the sweep contains its own
# control and "the new terms do nothing" is a result it can return.
#
# n_steps and batch_size are searched narrowly around the tuned winner's
# rollout shape rather than pinned; every pair divides the 8-env rollout.
name: ppo_terminal_near_4M
program: src/owm/baselines/rl/sweep_trial.py
command:
  - ${env}
  - uv
  - run
  - python
  - -m
  - owm.baselines.rl.sweep_trial
method: bayes
metric:
  name: sweep/eval_safe_min_pos_m
  goal: minimize
early_terminate:
  type: hyperband
  # In objective reports; at wandb's default eta of 3 the rungs land at
  # reports 2 and 6 -- 20% and 60% of the 4M horizon.
  min_iter: 2
parameters:
  algo:
    value: ppo
  environments:
    value: iss_numerical_ports_progress_1hz_near_terminal
  # The three new reward weights, routed by sweep_trial to
  # environments.reward_weights.*. The env config's own values sit inside
  # every range, and 0.0 is the published-baseline reward.
  proximity:
    values: [0.0, 0.25, 0.5, 1.0]
  alignment:
    values: [0.0, 0.25, 0.5, 1.0]
  effort:
    values: [0.0, -0.02, -0.05, -0.1]
  seed:
    value: 0
  trial_timesteps:
    # Same sizing as ppo_vector: ~3 h a trial at the measured 376
    # env-steps/s, four full-length trials per agent overnight.
    value: 4000000
  # ppo_tuned winners, pinned: this sweep varies the reward, and a second
  # free axis would make every comparison a mixture. n_steps/batch_size
  # excepted (see header).
  policy_kwargs:
    value: {net_arch: [256, 256, 256]}
  learning_rate:
    value: 0.00021578468144928557
  n_steps:
    values: [2048, 4096]
  batch_size:
    values: [512, 1024]
  gamma:
    value: 0.997
  gae_lambda:
    value: 0.9453223308741135
  ent_coef:
    value: 0.001
  clip_range:
    value: 0.1
  n_epochs:
    value: 20
  target_kl:
    value: 0.02
  vf_coef:
    value: 0.6666451279183626
