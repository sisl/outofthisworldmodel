# wandb Bayesian sweep over SAC on the ISS docking env, state + frozen-ResNet
# observations (rl.obs=vector_resnet): the 27-d state vector with a frozen
# ImageNet ResNet18's 512-d embedding of the rendered frame concatenated onto
# it, as one flat Box (owm/envs/resnet_obs.py). The policy is still MlpPolicy
# -- the embedding changes the input width, not the algorithm.
#
#   just sweep-init sac_resnet          # prints the sweep id
#   just sweep-agent <id> sac_resnet    # one agent, pinned to a GPU
#
# environments is the render224 variant of the close-start config: the same
# iss-numerical dynamics at a 1 s control step and the same progress-shaped
# reward, begun 100-125 m out rather than across a five-fold band. progress is
# left at that config's own -2.0 rather than swept, unlike sac_vector:
# sweeping it there did not separate the medians, and a dimension that buys
# nothing is expensive at this trial count.
#
# READ AGAINST THE RIGHT FLOOR. The zero-thrust baseline on this config is
# -168.5 over 20 episodes and -165.2 over 5, measured with
# pocs/null_action_baseline.py. Those are the numbers a trial has to beat, and
# they are far above the floor on the wide-band config, because a shorter
# start pays less progress reward for the same fraction of range closed. A
# return from a wide-band sweep is not a comparison for anything here.
#
# WHAT THIS SEARCHES, AND THE COST OF SEARCHING IT. Eight dimensions, which is
# wide for a lane whose trials cost ~4x a vector one per step and which
# therefore affords tens of trials rather than hundreds. That is a deliberate
# trade rather than an oversight.
#
# The alternative was to pin gamma and tau at the frozen vector winners and
# search only what the observation changes. Those winners were tuned across a
# 100-500 m start band, so on this config they are values carried over from a
# different task, and a narrow search around them would have been precise
# about the wrong point. Searching them buys correctness at the price of
# resolution.
#
# Read the result accordingly: with this many dimensions and this trial count,
# expect the sweep to identify a REGION -- an architecture, an order of
# magnitude of learning rate -- rather than to rank individual configurations
# credibly. That is what the wide-band pixel sweep delivered, where
# [512, 512, 512] took every strong result and no other architecture beat the
# baseline at all, while the ordering within it was seed variance. A single
# winner here is a hypothesis to replicate across seeds
# (sweeps/sac_resnet_seeds.yaml), not a result.
#
# The learner runs on the GPU as it does for sac_vector, and so does the
# extractor: sweep_trial pins it to the card (PIXEL_EXTRACTOR_DEVICE) rather
# than leaving it on the workers' CPUs, where a ResNet-18 forward per env per
# step costs more than the render feeding it.
#
# The workers still cost GPU memory besides, because every one of them renders
# and the renderer takes a Vulkan device worth ~1.9 GB. sweep_trial caps a
# pixel trial at 4 workers for that reason.
#
# These specs live outside conf/ because they are wandb sweep files, not hydra
# configs: a conf/sweep/ directory would appear in hydra's group discovery and
# read as a config group nothing ever selects.
name: sac_resnet_close_500k
program: src/owm/baselines/rl/sweep_trial.py
command:
  - ${env}
  - uv
  - run
  - python
  - -m
  - owm.baselines.rl.sweep_trial
method: bayes
metric:
  name: sweep/eval_mean_return
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 2
parameters:
  algo:
    value: sac
  obs:
    value: vector_resnet
  environments:
    value: iss_numerical_ports_progress_1hz_close_render224
  seed:
    value: 0
  trial_timesteps:
    # Measured on the host, not inherited: pocs/pixel_throughput.py puts a
    # pixel SAC trial at 62 env-steps/s with four trials per lane sharing the
    # machine, so 500k is ~2.25 h and an agent completes eight in an overnight
    # run. Re-measure before reusing this number anywhere else -- it is a
    # property of the card, the core count and the fleet width, not of SAC.
    value: 500000
  # --- pinned, and why each pin survives the change of task ---
  # Written out as literals rather than left to fall through: sweep_trial
  # composes `rl=sac`, so an unswept hyperparameter takes conf/rl/sac.yaml's
  # base default rather than anything tuned.
  train_freq:
    # Held at 4 so gradient_steps below reads as an update-to-data ratio
    # rather than half of one. Sweeping both would make the quantity that
    # actually matters -- updates per transition -- a derived product of two
    # searched dimensions, and no single trial would say what it was.
    value: 4
  target_entropy:
    # Held on the sac_entropy ablation's evidence: sweeping -3/-1/0/+3 with
    # everything else fixed found the within-setpoint spread larger than the
    # differences between setpoints. That is a statement about the setpoint
    # mattering little, which the start distance does not change.
    value: -12.0
  ent_coef:
    # Adaptive, never a fixed value. Fixed ones diverged SAC into an actor NaN
    # within minutes in 4 of 7 trials against 0 of 3 adaptive. The adaptation
    # is also what holds entropy at a setpoint rather than letting it decay,
    # which is the mechanism whose absence collapsed the PPO training run.
    value: auto
  # --- searched ---
  # gamma and tau were pinned at conf/rl/sac_tuned.yaml's frozen values, which
  # were tuned across a 100-500 m start band. On a 100-125 m band those are
  # values from a different task: gamma prices a horizon a fifth as deep in
  # range, and tau sets how fast the critic tracks a return distribution whose
  # scale has moved -- the zero-thrust floor alone went from -395 to -168.
  # Searching them costs dimensions this trial count feels, so read a single
  # winner here as weaker evidence than the pixel sweep on the wide band gave.
  gamma:
    values: [0.9, 0.95, 0.99, 0.997]
  tau:
    distribution: log_uniform_values
    min: 1.0e-3
    max: 2.0e-2
  policy_kwargs:
    # The headline question. vector_resnet makes the observation 539 wide
    # rather than 27, and conf/rl/sac_resnet.yaml's [256, 256] is reasoning
    # about compression ratios rather than a measured result.
    #
    # The range is shifted up from sac_vector's rather than widened, to probe
    # capacity without costing a trial count this sweep does not have. Up,
    # because sac_vector's evidence is that its own range was capped: both it
    # and ppo_vector chose [256, 256, 256], the deepest architecture either was
    # offered, on an observation a twentieth as wide as this one. [64, 64] is
    # dropped in exchange -- neither vector winner went near it, and it would
    # compress 539 inputs 8.4x before anything is learned from them.
    values:
      - {net_arch: [256, 256]}
      - {net_arch: [512, 512]}
      - {net_arch: [256, 256, 256]}
      - {net_arch: [512, 512, 512]}
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3
  batch_size:
    values: [256, 512, 1024]
  gradient_steps:
    # The update-to-data ratio at this width: with train_freq 4 and 4 envs, SAC
    # takes this many gradient steps per 16 transitions.
    values: [1, 2, 4]
  learning_starts:
    values: [5000, 10000, 20000]
  buffer_size:
    # Unlike the vector spec, this dimension can separate trials here: at a
    # 500k horizon 300k evicts and 1M does not. The cost is RAM, ~4.35 GB per
    # million transitions at the 539-wide observation against 0.25 GB at the
    # vector width.
    values: [300000, 1000000]
