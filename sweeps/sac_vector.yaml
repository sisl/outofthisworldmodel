# wandb Bayesian sweep over SAC on the iss-numerical docking env, vector
# observations, dense-dominant reward at a 1 Hz control step.
#
#   just sweep-init sac_vector          # prints the sweep id
#   just sweep-agent <id> sac_vector    # one agent, on GPU 2
#   just sweep-agent <id> sac_vector 3  # a second agent, on GPU 3
#
# One spec per (algo, obs mode) pair; the pixel specs land with rl.obs.
#
# These specs live outside conf/ because they are wandb sweep files, not hydra
# configs: a conf/sweep/ directory would appear in hydra's group discovery and
# read as a config group nothing ever selects.
program: src/owm/baselines/rl/sweep_trial.py
command:
  - ${env}
  - uv
  - run
  - python
  - -m
  - owm.baselines.rl.sweep_trial
method: bayes
metric:
  name: sweep/eval_mean_return
  goal: maximize
early_terminate:
  type: hyperband
  # In objective reports, not steps or epochs. sweep_trial reports the
  # objective EVAL_REPORTS times over a trial, so at wandb's default eta of 3
  # the rungs land at reports 2 and 6 -- 20% and 60% of the horizon below,
  # i.e. 300k and 900k steps. The first rung sits 15x past the longest
  # learning_starts this spec can draw, so no trial is banded before it has
  # taken a gradient step.
  min_iter: 2
parameters:
  algo:
    value: sac
  environments:
    # The dense-dominant reward with the soft keep-out zone, flown at a 1 s
    # control step, in the progress variant so reward_weights.progress exists
    # for the `progress` parameter below to write. See sweeps/ppo_vector.yaml
    # for why both lanes train here and why this one term is safe to search
    # against mean return.
    value: iss_numerical_ports_progress_1hz
  progress:
    # 0.0 is no progress term at all; the rest pay the metre as it is closed.
    # The 20M-step runs on the no-progress reward learned to stop escaping and
    # never to close -- mean closest approach sat at ~0.87 of the start range
    # with zero docks -- which is the failure this term exists to price.
    values: [0.0, -1.0, -2.0, -4.0]
  seed:
    value: 0
  trial_timesteps:
    # The trial's whole horizon. Pinned per spec rather than in code so a
    # slower obs mode can buy itself a different one.
    #
    # Sized from a measurement on the training host: this lane runs 119
    # env-steps/s at n_envs 4 and the densest update ratio below, so 1.5M
    # steps is ~3.5 h of training at the slow end of the search space and
    # faster at the sparse end. Lower than the PPO lane's horizon because SAC
    # pays a gradient step out of the same wall clock PPO spends stepping.
    value: 1500000
  policy_kwargs:
    # Network capacity, as one categorical: SB3's MlpPolicy defaults differ
    # per algorithm (PPO 64x64, SAC 256x256), so the options span both
    # defaults plus one wider and one deeper net. A dict-valued categorical
    # routes to rl.hyperparams.policy_kwargs like any other SB3 argument.
    values:
      - {net_arch: [64, 64]}
      - {net_arch: [256, 256]}
      - {net_arch: [512, 512]}
      - {net_arch: [256, 256, 256]}
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3
  batch_size:
    values: [256, 512, 1024]
  gamma:
    # dt=1 s, so these are lookaheads of 10 s, 20 s, 100 s and ~330 s against
    # a 360 s episode. See sweeps/ppo_vector.yaml for why the range sits here.
    values: [0.9, 0.95, 0.99, 0.997]
  tau:
    distribution: log_uniform_values
    min: 1.0e-3
    max: 2.0e-2
  target_entropy:
    # SAC's exploration setpoint. ent_coef is left at SB3's "auto", which
    # learns the temperature to hold the policy's entropy at this target;
    # "auto" here is -dim(A), i.e. -6 for the 6-dof action. Lower targets buy a
    # more deterministic policy that commits to an approach, higher ones keep
    # it sampling around one, and which of those the dense reward wants is the
    # question this dimension asks.
    #
    # The setpoint rather than a fixed ent_coef, which is the other way to ask
    # it and measured badly: fixed temperatures diverged 4 of 7 trials against
    # 0 of 3 adaptive ones, the actor going NaN within three minutes every
    # time. With alpha frozen nothing regulates the squashed Gaussian's
    # log_std, so it drifts until log_prob overflows -- and a diverged trial
    # reports no objective at all, so the search cannot even learn to avoid
    # the region. Holding alpha adaptive and moving its target keeps the knob
    # without the failure mode.
    values: ["auto", -3.0, -12.0]
  train_freq:
    # Pinned, so that gradient_steps alone sets the update-to-data ratio.
    # Swept independently these two span a 64x range of gradient steps per
    # trial, and at the top of it a trial owes more updates than the wall-clock
    # bound can pay for -- so it would time out having trained a fraction of
    # its horizon, possibly before hyperband's rungs. The sweep would then be
    # ranking compute cost as much as learning. Bounding the ratio is what
    # keeps trials comparable.
    value: 4
  gradient_steps:
    # At train_freq 4 and n_envs 4, SAC updates once per 16 transitions per
    # gradient step, so these are UTD 1/16, 1/8 and 1/4. The dense end is what
    # the horizon above was measured at; the sparse end is 4x cheaper. Higher
    # ratios are excluded rather than merely unlikely: this lane is sample
    # starved against the tens of millions of steps the reference results
    # trained on, and a trial that spends its wall clock on updates instead of
    # transitions is the wrong side of that trade.
    values: [1, 2, 4]
  learning_starts:
    values: [5000, 10000, 20000]
  buffer_size:
    # A 1.5M-step trial never fills 1M, but the smaller buffer forgets its
    # early transitions, which is the thing worth measuring.
    values: [300000, 1000000]
