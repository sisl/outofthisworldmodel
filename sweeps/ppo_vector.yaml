# wandb Bayesian sweep over PPO on the iss-numerical docking env, vector
# observations, dense-dominant reward at a 1 Hz control step.
#
#   just sweep-init ppo_vector          # prints the sweep id
#   just sweep-agent <id> ppo_vector    # one agent, CPU only
#
# One spec per (algo, obs mode) pair; the pixel specs land with rl.obs.
#
# These specs live outside conf/ because they are wandb sweep files, not hydra
# configs: a conf/sweep/ directory would appear in hydra's group discovery and
# read as a config group nothing ever selects.
program: src/owm/baselines/rl/sweep_trial.py
command:
  - ${env}
  - uv
  - run
  - python
  - -m
  - owm.baselines.rl.sweep_trial
method: bayes
metric:
  name: sweep/eval_mean_return
  goal: maximize
early_terminate:
  type: hyperband
  # In objective reports, not steps or epochs. sweep_trial reports the
  # objective EVAL_REPORTS times over a trial, so at wandb's default eta of 3
  # the rungs land at reports 2 and 6 -- 20% and 60% of the horizon below,
  # i.e. 800k and 2.4M steps. The first rung is what bounds the cost of a bad
  # draw: a trial killed there spent a fifth of a full one.
  min_iter: 2
parameters:
  algo:
    value: ppo
  environments:
    # The dense-dominant reward with the soft keep-out zone, flown at a 1 s
    # control step. The dense terms carry the task and the events are
    # corrections, so a trial's score reflects how it flies rather than
    # whether a terminal bonus survived the discount; and one decision per
    # second over a 360 s episode is 360 decisions rather than 7,200, which is
    # the cadence both Broida and Linares (AAS 19-462) and Dunlap et al.
    # (JAIS 20(1) 2023) trained at.
    #
    # The progress variant, so reward_weights.progress exists for the `progress`
    # parameter below to write. Its own -2.0 is one of the values searched, and
    # 0.0 among them is exactly iss_numerical_ports_dense_1hz.
    value: iss_numerical_ports_progress_1hz
  progress:
    # Whether closing the range is paid when it is closed, and how much. 0.0 is
    # the absolute-position reward with no progress term at all; the rest price
    # the metre as it is closed rather than through the slow decay of an
    # absolute penalty. On this config the first step of a 1 m/s approach loses
    # 0.005 without the term and gains 0.004 at -2.0, which is the difference
    # between an approach undirected exploration can discover and one it
    # cannot.
    #
    # Comparable under mean return, unlike the event weights, because the term
    # telescopes to progress * (start_range - end_range) / position_scale_m --
    # bounded by the 500 m start shell at under 9 of return, against episodes
    # that score in the hundreds. It also cannot be farmed by cycling in and
    # out, since only the endpoints survive the telescoping.
    values: [0.0, -1.0, -2.0, -4.0]
  seed:
    value: 0
  trial_timesteps:
    # The trial's whole horizon. Pinned per spec rather than in code so a
    # slower obs mode can buy itself a different one.
    #
    # Sized from a measurement on the training host: this lane runs 376
    # env-steps/s at n_envs 8, so 4M steps is ~3 h of training, and an agent
    # gets through four full-length trials in an overnight window. At dt=1 s
    # that is 4M seconds of flight, ~11,000 episodes.
    value: 4000000
  policy_kwargs:
    # Network capacity, as one categorical: SB3's MlpPolicy defaults differ
    # per algorithm (PPO 64x64, SAC 256x256), so the options span both
    # defaults plus one wider and one deeper net. A dict-valued categorical
    # routes to rl.hyperparams.policy_kwargs like any other SB3 argument.
    values:
      - {net_arch: [64, 64]}
      - {net_arch: [256, 256]}
      - {net_arch: [512, 512]}
      - {net_arch: [256, 256, 256]}
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3
  n_steps:
    values: [512, 1024, 2048, 4096]
  batch_size:
    values: [256, 512, 1024]
  gamma:
    # dt=1 s, so these are lookaheads of 10 s, 20 s, 100 s and ~330 s against
    # a 360 s episode. The top of the range is effectively undiscounted over
    # the horizon and the bottom is deliberately myopic: the dense reward pays
    # per step, so a short lookahead is a viable way to fly it rather than the
    # degenerate setting it would be under a terminal-bonus reward. Broida and
    # Linares flew 0.9 at this cadence and Dunlap et al. 0.99.
    values: [0.9, 0.95, 0.99, 0.997]
  gae_lambda:
    distribution: uniform
    min: 0.9
    max: 0.98
  ent_coef:
    distribution: log_uniform_values
    min: 1.0e-8
    max: 1.0e-2
  clip_range:
    values: [0.1, 0.2, 0.3]
  n_epochs:
    values: [5, 10, 20]
  vf_coef:
    # The value loss's weight against the policy loss. Worth searching because
    # the two are weighted against each other in raw units and the reward's
    # scale is set by the dense terms: an episode's return runs to a few
    # hundred, where a reward carried by terminal events runs to tens of
    # thousands. SB3's 0.5 default sits inside this range rather than at an
    # edge of it.
    distribution: uniform
    min: 0.2
    max: 1.0
