# wandb Bayesian sweep over PPO on the ISS docking env, state + frozen-ResNet
# observations (rl.obs=vector_resnet): the 27-d state vector with a frozen
# ImageNet ResNet18's 512-d embedding of the rendered frame concatenated onto
# it, as one flat Box (owm/envs/resnet_obs.py). The policy is still MlpPolicy
# -- the embedding changes the input width, not the algorithm.
#
#   just sweep-init ppo_resnet          # prints the sweep id
#   just sweep-agent <id> ppo_resnet    # one agent
#
# environments is the render224 variant of the close-start config: the same
# iss-numerical dynamics at a 1 s control step and the same progress-shaped
# reward, begun 100-125 m out rather than across a five-fold band. progress is
# left at that config's own -2.0 rather than swept, unlike ppo_vector:
# sweeping it there did not separate the medians, and a dimension that buys
# nothing is expensive at this trial count.
#
# READ AGAINST THE RIGHT FLOOR. The zero-thrust baseline on this config is
# -168.5 over 20 episodes and -165.2 over 5, measured with
# pocs/null_action_baseline.py. Those are the numbers a trial has to beat, and
# they are far above the floor on the wide-band config, because a shorter
# start pays less progress reward for the same fraction of range closed. A
# return from a wide-band sweep is not a comparison for anything here.
#
# WHAT THIS SEARCHES, AND THE COST OF SEARCHING IT. Nine dimensions, which is
# wide for a lane whose trials cost ~15x a vector one per step and which
# therefore affords tens of trials rather than hundreds. That is a deliberate
# trade rather than an oversight.
#
# The alternative was to pin gamma, clip_range and vf_coef at the frozen
# vector winners and search only what the observation changes. Those winners
# were tuned across a 100-500 m start band, so on this config they are values
# carried over from a different task, and a narrow search around them would
# have been precise about the wrong point. Searching them buys correctness at
# the price of resolution.
#
# Read the result accordingly: with this many dimensions and this trial count,
# expect the sweep to identify a REGION -- an architecture, an order of
# magnitude of learning rate -- rather than to rank individual configurations
# credibly. A single winner here is a hypothesis to replicate across seeds
# (see sweeps/sac_resnet_seeds.yaml for that pattern), not a result.
#
# The learner runs on CPU as it does for ppo_vector; the extractor does not.
# sweep_trial pins it to the card (PIXEL_EXTRACTOR_DEVICE): a ResNet-18 forward
# per env per step is what bounds this mode's throughput, and single-threaded
# on CPU it costs more than the render feeding it.
#
# This lane is NOT GPU-free even so. Every worker renders, and the renderer
# takes a Vulkan device worth ~1.9 GB -- Vulkan does not honour
# CUDA_VISIBLE_DEVICES, so a pixel PPO trial costs the same GPU memory as a
# pixel SAC one. sweep_trial caps a pixel trial at 4 workers for that reason.
#
# These specs live outside conf/ because they are wandb sweep files, not hydra
# configs: a conf/sweep/ directory would appear in hydra's group discovery and
# read as a config group nothing ever selects.
name: ppo_resnet_close_500k
program: src/owm/baselines/rl/sweep_trial.py
command:
  - ${env}
  - uv
  - run
  - python
  - -m
  - owm.baselines.rl.sweep_trial
method: bayes
metric:
  name: sweep/eval_mean_return
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 2
parameters:
  algo:
    value: ppo
  obs:
    value: vector_resnet
  environments:
    value: iss_numerical_ports_progress_1hz_close_render224
  seed:
    value: 0
  trial_timesteps:
    # Measured on the host, not inherited: pocs/pixel_throughput.py puts a
    # pixel PPO trial at 66 env-steps/s with four trials per lane sharing the
    # machine, so 500k is ~2.1 h and an agent completes eight in an overnight
    # run. Re-measure before reusing this number anywhere else -- it is a
    # property of the card, the core count and the fleet width, not of PPO.
    value: 500000
  # --- pinned, and why each pin survives the change of task ---
  # Written out as literals rather than left to fall through: sweep_trial
  # composes `rl=ppo`, so an unswept hyperparameter takes conf/rl/ppo.yaml's
  # base default, and gae_lambda there is a dt=50 ms value.
  gae_lambda:
    # Held at ppo_tuned's value. It smooths credit assignment over an episode,
    # and the episode is still 360 steps of 1 s -- the close-start config
    # changed where a trajectory begins, not how long it runs -- so this is
    # the one member of that frozen group whose justification does not depend
    # on the start distance.
    value: 0.9453223308741135
  # --- searched ---
  # gamma, clip_range and vf_coef were pinned at conf/rl/ppo_tuned.yaml's
  # frozen values, which were tuned across a 100-500 m start band. On a
  # 100-125 m band those are values from a different task: gamma prices a
  # horizon that is now a fifth as deep in range, and the value function
  # clip_range and vf_coef balance is fitting a return distribution whose
  # scale has moved -- the zero-thrust floor alone went from -395 to -168.
  # Searching them costs dimensions this trial count feels, so read a single
  # winner here as weaker evidence than the pixel sweep on the wide band gave.
  gamma:
    values: [0.9, 0.95, 0.99, 0.997]
  clip_range:
    values: [0.1, 0.2, 0.3]
  vf_coef:
    distribution: uniform
    min: 0.2
    max: 1.0
  policy_kwargs:
    # The headline question. vector_resnet makes the observation 539 wide
    # rather than 27, and conf/rl/ppo_resnet.yaml's [256, 256] is reasoning
    # about compression ratios rather than a measured result.
    #
    # The range is shifted up from ppo_vector's rather than widened, to probe
    # capacity without costing a trial count this sweep does not have. Up,
    # because ppo_vector's evidence is that its own range was capped: both it
    # and sac_vector chose [256, 256, 256], the deepest architecture either was
    # offered, on an observation a twentieth as wide as this one. [64, 64] is
    # dropped in exchange -- neither vector winner went near it, and it would
    # compress 539 inputs 8.4x before anything is learned from them.
    #
    # Depth costs more here than in the SAC lane, whose learner has a card:
    # PPO's gradient work runs on CPU, so the widest architecture is also the
    # slowest trial and the likeliest to reach TrialTimeoutCallback's bound
    # before its horizon. Read a timed-out trial as evaluated at fewer steps
    # rather than as a worse architecture.
    values:
      - {net_arch: [256, 256]}
      - {net_arch: [512, 512]}
      - {net_arch: [256, 256, 256]}
      - {net_arch: [512, 512, 512]}
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3
  n_steps:
    # Swept rather than pinned because it cannot be inherited: ppo_tuned holds
    # a 32,768-transition rollout as 1024 x 32 envs, and a pixel trial runs 4.
    # These give rollouts of 4k, 8k and 16k.
    values: [1024, 2048, 4096]
  batch_size:
    values: [256, 512, 1024]
  n_epochs:
    values: [5, 10, 20]
  ent_coef:
    # Floored at 1e-3, which is the whole point of this range. A 100M-step
    # vector run trained at 1.23e-8 -- effectively no entropy bonus -- and its
    # policy entropy collapsed: action sigma fell
    # 1.00 -> 0.59 by 8M -> 0.21 by 16M -> 0.079 by 62M, entropy_loss crossed
    # zero at 16M, and return peaked at -103 there and degraded to -741 over
    # the following 46M steps. A value that small is harmless at a sweep
    # horizon and fatal at a training one, so the sweep must not be able to
    # pick it: what is being searched here is how much exploration to hold,
    # not whether to hold any.
    distribution: log_uniform_values
    min: 1.0e-3
    max: 1.0e-2
  target_kl:
    # The other half of that failure. The same run drove approx_kl to 0.55 at
    # 16M against the 0.01-0.02 a PPO update is normally held to, with 80% of
    # samples clipped, because n_epochs up to 20 re-uses a batch far past the
    # point the trust region is still valid. target_kl stops the epoch loop
    # once the update has moved that far, which bounds the damage whatever
    # n_epochs is drawn. Pinned rather than searched: it is a safety rail, and
    # a sweep free to raise it would just rediscover the collapse.
    value: 0.02
