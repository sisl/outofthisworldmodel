# Same base as iss_coop_goal_ports.yaml, but dock.ports names only the two
# ports that appear in the published 500k dataset's val split
# (splits.val.policy.dock.ports in owm-envs configs/generation_500k.yaml)
# and never in its train split: harmony_zenith_cbm and poisk_zenith. A
# policy trained on iss_coop_goal_ports.yaml's five train ports never sees
# these during training, so evaluating on this config measures
# goal-generalization to unseen ports rather than in-distribution
# performance.
#
# See iss_coop_goal_ports.yaml for why the port set is written out
# explicitly and why order matters.
dt: 0.05
max_steps: 7200
max_range_m: 750.0
render_view: DRAGON_FPV
physics:
  mass: 12000.0
  inertia_diag: [80000.0, 80000.0, 50000.0]
  linear_damping: 0.0
  angular_damping: 0.0
  dragon_collision_radius_m: 2.25
  start_radius_range_m: [100.0, 500.0]
  collision_boxes_path: collision_boxes.yaml
control:
  limit_force_n: 1600.0
  limit_torque_nm: 2000.0
dock:
  position: [0.225, -24.5, -2.5]
  quaternion: [0.7071068, -0.7071068, 0.0, 0.0]
  enabled: true
  max_distance_m: 0.1
  max_velocity_m_s: 0.5
  max_attitude_error_deg: 5.0
  max_body_rate_rad_s: 0.008727
  ports:
    - harmony_zenith_cbm
    - poisk_zenith
sensor_noise:
  enabled: true
  sigma_pos_m: 0.05
  sigma_pos_frac_of_range: 0.0
  sigma_vel_m_s: 0.002
  sigma_att_rad: 5.0e-05
  sigma_rate_rad_s: 1.0e-05
observation:
  goal_error: true
reward_weights:
  position: -0.5
  velocity: -0.2
  attitude: -0.2
  body_rate: -0.1
  collision: -1000000.0
  dock_success: 10000.0
  escape: -10000.0
reward_shaping:
  position_delta_m: 1.0
  position_scale_m: 225.0
  velocity_delta_m_s: 0.1
  velocity_scale_m_s: 5.0
  attitude_delta_rad: 0.05
  attitude_scale_rad: 3.141592653589793
  rate_delta_rad_s: 0.005
  rate_scale_rad_s: 0.05
  rotation_gate_far: 0.1
  rotation_gate_range_m: 25.0
