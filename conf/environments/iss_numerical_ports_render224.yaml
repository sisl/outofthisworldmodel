# iss_numerical_ports rendered at 224x224, the input size the ImageNet ResNets
# were trained at. Only rl.obs=vector_resnet reads the frame, so this differs
# from iss_numerical_ports in nothing a vector-observation run can see: the
# render block is a graphics setting, not a dynamics or reward one.
#
# Rendering the frame at the size the extractor wants avoids resampling the
# renderer's 512x512 default down to 224 on every single step.
#
# The pixel counterpart of iss_coop_goal_ports_render224, against the
# iss-numerical dynamics the vector baselines retargeted onto.
defaults:
  - iss_numerical_ports
  - _self_

render:
  image_width: 224
  image_height: 224
