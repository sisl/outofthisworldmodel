# The progress-shaped 1 Hz config, started from a close, narrow band.
#
# WHY. Every result on the wide band closes range without ever docking: the
# best pixel SAC trials reach 7-20% of their start range and stop, and the
# 100M-step PPO run reached -103 before its exploration collapsed. Starting at
# 100-500 m, a policy has to learn the approach over a start distance that
# varies five-fold, and the reward it learns from is dominated by whichever
# start it drew. Narrowing to 100-125 m makes the task one distance rather than
# a family of them, and puts the dock gate within a few hundred metres of
# travel rather than half a kilometre.
#
# It also moves the escape boundary out of reach. max_range_m is 750, so a wide
# episode could start two thirds of the way to it; here it starts at a sixth,
# and escape -- the term every sweep found to be THE discriminator between
# policies that beat the zero-thrust baseline and policies that do not -- stops
# being the easiest thing for an untrained policy to do.
#
# NOT COMPARABLE with results on iss_numerical_ports_progress_1hz. The start
# distribution is the input to every return in this project: the progress term
# telescopes to progress * (start_range - end_range) / position_scale_m, so a
# shorter start pays less progress reward for the same fraction closed, and the
# zero-thrust baseline moves too. Re-measure the baseline on this config with
# pocs/null_action_baseline.py before reading any policy against it.
defaults:
  - iss_numerical_ports_progress_1hz
  - _self_

orbit:
  start_radius_range_m: [100.0, 125.0]
