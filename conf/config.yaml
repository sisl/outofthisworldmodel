defaults:
  - environments: iss_numerical_ports
  - rl: ppo
  - logging: wandb
  - _self_

run_name: ${rl.algo}_${now:%Y%m%d_%H%M%S}
run_dir: runs/${run_name}
resume: false
seed: 0
# Raise a resumed run's total_timesteps budget. Lives here rather than under
# rl/ because rl.total_timesteps always composes to its group default, which a
# resume cannot tell apart from a deliberate request.
extend_timesteps: null
# The caller already opened the wandb run and owns its lifecycle (sweep
# trials): training logs into that run instead of starting one of its own.
external_wandb: false

# Periodic validation episodes on the dock task: known-seed deterministic
# rollouts logged to wandb as composite+FPV video, 3D trajectory/attitude
# plots, and reward/force/torque traces (val/*). Needs the render assets on
# disk whenever video_episodes > 0 -- see README's Rendering section.
val:
  enabled: true
  every_steps: 50000
  episodes: 3
  video_episodes: 1     # the first N episodes are rendered to video
  max_frames: 1200      # 60 s at render_fps=20; plots always cover the whole episode
hub:
  upload: true
  repo_id: ${oc.env:OWM_HF_MODEL_REPO,null}
eval:
  checkpoint: null       # local path or hf:<org>/<repo>/<path/in/repo.zip>
  episodes: 20
  deterministic: true
  video_path: null       # write an mp4 of the first episode here (needs render extra)
  allow_unnormalized: false  # evaluate on raw obs when no VecNormalize stats exist

# Per-port evaluation under every success definition (owm.baselines.rl.eval_matrix).
# The environment is the run's own env_config.yaml, not this file's
# `environments` group: a policy is scored on what it trained on.
eval_matrix:
  checkpoint: null       # local path or hf:<org>/<repo>/<path/in/repo.zip>
  run_dir: null          # env_config.yaml source; found beside the checkpoint by default
  ports: all             # every port owm-envs knows, or an explicit list of names
  trials: 50             # episodes per port
  seed: 100000           # base seed, disjoint from training's and val's
  # null keeps the run's own dt. A number re-times dt and max_steps together,
  # holding the horizon in seconds -- 20 flies the same 360 s at 20 Hz.
  rate_hz: null
  # Decisions are held for this many env steps. Independent of rate_hz: pair
  # rate_hz=20 with action_repeat=20 to fly a 1 Hz policy at its trained
  # cadence over finer integration, or with 1 to ask it for 20x the decisions.
  action_repeat: 1
  criteria: [position, position_velocity, full]
  # Scoring is online during the rollout, so every extra tolerance is
  # free: one rollout answers all of them. Spend that on resolution.
  tolerances_m: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
  n_envs: 10
  vec: subproc
  out_dir: null          # defaults to runs/evals/<run>_<timestamp>
  allow_unnormalized: false
