# Winner of the PPO vector sweep, frozen per docs/baselines.md's
# winner-freezing convention.
#
#   sweep nh7k6mai:
#   https://wandb.ai/duncan-world-models/amos-out-of-this-world-model/sweeps/nh7k6mai
#   winning run lyric-sweep-21:
#   objective (sweep/final_mean_return): -87.0
#   frozen: 2026-08-14
#
# Launch it against the reward it was tuned on. The `progress` weight is an
# ENVIRONMENT term, not an SB3 argument, so it does not live in hyperparams
# below and has to be passed:
#
#   just train-ppo rl=ppo_tuned environments=iss_numerical_ports_progress_1hz \
#       environments.reward_weights.progress=-1.0
#
# WHAT THIS WINNER IS. The first configuration in this project to beat a
# zero-thrust policy by a wide margin: -87 against the null baseline's -405.7
# on the same 20 eval episodes (pocs/null_action_baseline.py), escaping 1% of
# episodes and closing to 0.8% of its starting range -- metres, from a 100-500 m
# start shell. Earlier sweeps ranked configurations by how reliably they held
# station; this one flies an approach.
#
# IT STILL DOES NOT DOCK. sweep/final_success is 0.00 here and for every other
# trial in the sweep. The dock gate is 0.1 m with velocity, attitude and
# body-rate constraints on top, and closing to metres is not the same problem
# as closing to centimetres. Read this as the best approach controller the
# sweep found, not as a docking policy.
#
# CHOSEN FOR AGREEMENT, NOT JUST FOR RANK. The ablation in sweeps/
# sac_entropy.yaml measured seed-to-seed spread at 200-400 return units with
# every hyperparameter held fixed, which is wider than the gap between the top
# few trials -- so the single best trial is not reliably the single best
# configuration. gamma, n_steps, batch_size and clip_range below are what the
# top two trials independently agreed on; learning_rate, n_epochs, vf_coef and
# net_arch are the winner's own values, taken because the two disagreed and it
# scored higher, not because the difference is resolved.
#
# ONE DELIBERATE DEVIATION FROM THE TRIAL. The winning trial ran n_envs 8 with
# n_steps 4096; this runs n_envs 32 with n_steps 1024. PPO's rollout is
# n_steps * n_envs, so both are 32,768 transitions per update, and at
# batch_size 1024 both give 32 minibatches over 20 epochs. Wider is ~2x faster
# on this box (measured 801 env-steps/s against 376 at n_envs 8) and
# decorrelates the rollout. n_steps here is therefore NOT the swept value read
# literally; the pair has to move together.
#
# TWO HYPERPARAMETERS ARE NOT THE TRIAL'S, BECAUSE THE TRIAL'S DO NOT SURVIVE
# THE HORIZON. A 100M-step run from this config with the winner's own
# ent_coef 1.23e-8 and no target_kl peaked around 8-16M and then collapsed,
# ending far below a zero-thrust policy. The mechanism was measured, not
# inferred:
#
#   train/std           1.00 -> 0.59 @8M -> 0.21 @16M -> 0.079 @62M
#   train/entropy_loss  -8.5 -> -5.3     -> +0.95 @16M -> +6.8
#   train/approx_kl     0.002 -> 0.029   -> 0.55 @16M  -> 0.25
#   train/clip_fraction 0.087 -> 0.54    -> 0.73       -> 0.80
#
# SB3 logs entropy_loss as -entropy, so it crossing zero at ~16M is the policy
# entropy going negative -- the action distribution collapsing to a near-point
# mass, exactly where return turned over. PPO's ent_coef is a plain float with
# no "auto" counterpart (SAC's is str|float and supports one), so nothing in
# the algorithm holds entropy up; a coefficient that vanishes is a run with no
# exploration floor. The sweep could not see this because its trials stopped
# at 4M, before the crossing.
#
# ent_coef 1e-3 and target_kl 0.02 are therefore JUDGEMENT, not sweep results.
# 1e-3 sits between the collapsed 1.23e-8 and the 7.3e-3 of a trial that
# underperformed at short horizon; target_kl 0.02 is the conventional value and
# bounds the 20-epoch update that let approx_kl reach 0.25. Neither has been
# tuned at length. If a later sweep searches them, it has to run past ~20M
# steps or it will rediscover the same wrong answer.
#
# GAE is not quite identical across that change: it runs per environment over
# each env's slice, so advantages come from 32 segments of 1024 steps rather
# than 8 of 4096, and every segment boundary bootstraps off the value function.
# At gamma 0.997 and gae_lambda 0.945 the trace has a ~250-step effective
# horizon, so truncation touches a larger share of samples here than at the
# trial's shape. Real, and in the direction of more value-function bias.
algo: ppo
n_envs: 32           # with n_steps 1024 this holds the trial's 32,768 rollout
vec: subproc
# Set by the wall clock available, not by the science: measured 801
# env-steps/s alone and ~640 sharing the box with a SAC run, so this is ~30 h.
# At dt=1 s it is 70M seconds of flight, ~195,000 episodes -- close to the
# 200,000 Broida and Linares (AAS 19-462) trained at, short of Dunlap et al.
# (JAIS 20(1) 2023, 170M).
total_timesteps: 70000000
device: cpu          # SB3 PPO+MlpPolicy is faster on CPU
# vector: the 25-dim state alone. vector_resnet: that vector with a frozen
# pretrained ResNet's embedding of the rendered frame concatenated onto it,
# still one flat Box, so the policy stays MlpPolicy either way. vector_resnet
# needs an env config that renders (see environments/iss_numerical_ports_render224).
obs: vector
obs_resnet:          # read only when obs=vector_resnet
  variant: resnet18
  layer: avgpool     # the pooled 512-d feature the classifier head would read
  image_size: 224
  device: null       # null: cpu in subproc workers, else rl.device
# Observations are always normalized (positions are O(100 m) against O(1e-3)
# body rates). Reward normalization is its own switch and defaults OFF: the
# shaped reward already costs ~1 per step at the envelope by construction,
# while a single event's spike lands in the normalizer's running return
# variance and crushes every shaped reward that follows it.
#
# action_repeat stays 1: the environment this is tuned on already takes one
# decision per second, at dt 1.0 over a 360-step horizon, so there is no long
# decision sequence left for it to shorten.
action_repeat: 1
norm_reward: false
checkpoint:
  # 40 checkpoints over the budget, so a crash costs at most ~1 h of stepping.
  # Affordable because a PPO checkpoint is the policy and its optimiser state
  # and nothing else -- a few MB at this width, ~160 MB for the whole run.
  save_freq: 2500000
hyperparams:
  n_steps: 1024      # trial value was 4096 at n_envs 8; see header
  batch_size: 1024
  learning_rate: 0.00021578468144928557
  gamma: 0.997
  gae_lambda: 0.9453223308741135
  # NOT the winning trial's value, which was 1.23e-8. See the header note on
  # entropy collapse: at 4M that draw is harmless and at 60M it is fatal.
  ent_coef: 0.001
  clip_range: 0.1
  n_epochs: 20
  # Also not from the trial, which left it unset. SB3 breaks out of the epoch
  # loop once approx_kl exceeds 1.5x this, so it bounds how far 20 epochs can
  # move the policy in one update. The collapsed run reached approx_kl 0.25
  # with 80% of samples clipped; 0.02 is the conventional target and would
  # have cut those updates short.
  target_kl: 0.02
  vf_coef: 0.6666451279183626
  policy_kwargs:
    net_arch: [256, 256, 256]
