algo: sac
n_envs: 4
vec: subproc
total_timesteps: 5000000
device: cuda
# vector: the 25-dim state alone. vector_resnet: that vector with a frozen
# pretrained ResNet's embedding of the rendered frame concatenated onto it,
# still one flat Box, so the policy stays MlpPolicy either way. vector_resnet
# needs an env config that renders (see environments/iss_coop_goal_ports_render224).
obs: vector
obs_resnet:          # read only when obs=vector_resnet
  variant: resnet18
  layer: avgpool     # the pooled 512-d feature the classifier head would read
  image_size: 224
  device: null       # null: cpu in subproc workers, else rl.device
# Observations are always normalized (positions are O(100 m) against O(1e-3)
# body rates). Reward normalization is its own switch and defaults OFF: the
# shaped reward already costs ~1 per step at the envelope by construction,
# while a single collision's -1e6 lands in the normalizer's running return
# variance and crushes every shaped reward that follows it.
norm_reward: false
checkpoint:
  save_freq: 100000
# Pre-flown trajectories to seed the replay buffer with before the first
# gradient step, so the critic has successful episodes to regress against
# rather than waiting for exploration to find one. Off by default: repo_id
# null means the dataset is neither downloaded nor read. Rewards are always
# RECOMPUTED under this run's own reward_weights, so a dataset flown under
# other weights still serves (see demo_buffer.py).
demo:
  repo_id: null            # e.g. sislaboratory/owm-iss-numerical-v1-coop-goal-dt50ms-500k
  revision: null           # branch/tag/sha; null tracks the default branch
  split: train
  policies: null           # null = every generating policy; e.g. [0, 2] for the dock ones
  successful_only: false   # keep only episodes that end inside THIS run's dock gate
  max_transitions: null    # null = the whole split, subject to buffer_size
hyperparams:
  buffer_size: 1000000
  batch_size: 256
  learning_rate: 3.0e-4
  gamma: 0.999
  learning_starts: 10000
