# Winner of the SAC vector sweep, frozen per docs/baselines.md's
# winner-freezing convention. hyperparams below are the winning trial's
# config verbatim; everything else matches conf/rl/sac.yaml.
#
#   sweep rnuijnos:
#   https://wandb.ai/duncan-world-models/amos-out-of-this-world-model/sweeps/rnuijnos
#   winning run vague-sweep-21 (w15cr6vi):
#   https://wandb.ai/duncan-world-models/amos-out-of-this-world-model/runs/w15cr6vi
#   objective (sweep/final_mean_return): -9256.71582031250
#   frozen: 2026-08-13
#
# The winner was tuned at 500k steps on iss_numerical_ports; total_timesteps
# below is the full production budget, not the trial's horizon.
#
# ONE DELIBERATE DEVIATION FROM THE TRIAL. The winning trial ran n_envs 4 with
# gradient_steps 1; this config runs n_envs 16 with gradient_steps 4. With
# train_freq 8, SAC takes one gradient step per train_freq * n_envs
# transitions, so both are one update per 32 transitions -- the update-to-data
# ratio the trial was tuned at, unchanged -- while collecting four times as
# fast. gradient_steps here is therefore NOT the swept value read literally;
# the swept value is 1 at n_envs 4, and the pair has to move together.
#
# CAVEAT ON THE OBJECTIVE. No trial in this sweep docked, and none beat a
# zero-thrust policy, which scores -4,642 on the same eval seeds
# (pocs/null_action_baseline.py) -- this winner is well short of it. The
# objective ranked trials by how reliably they stay put rather than by any
# progress toward the port. It is the correct frozen artefact for the sweep
# that produced it; it is not evidence that the task is being learned.
algo: sac
n_envs: 16          # with gradient_steps 4 this holds the trial's 1-per-32 UTD
vec: subproc
total_timesteps: 10000000
device: cuda
# vector: the 25-dim state alone. vector_resnet: that vector with a frozen
# pretrained ResNet's embedding of the rendered frame concatenated onto it,
# still one flat Box, so the policy stays MlpPolicy either way. vector_resnet
# needs an env config that renders (see environments/iss_coop_goal_ports_render224).
obs: vector
obs_resnet:          # read only when obs=vector_resnet
  variant: resnet18
  layer: avgpool     # the pooled 512-d feature the classifier head would read
  image_size: 224
  device: null       # null: cpu in subproc workers, else rl.device
# Observations are always normalized (positions are O(100 m) against O(1e-3)
# body rates). Reward normalization is its own switch and defaults OFF: the
# shaped reward already costs ~1 per step at the envelope by construction,
# while a single collision's -1e6 lands in the normalizer's running return
# variance and crushes every shaped reward that follows it.
# How many environment steps each action is held for. 1 is one decision per
# env step. Higher values shorten the decision sequence without touching the
# physics: at dt=0.05 s and max_steps 7200 an episode is 7,200 decisions at 1
# and 360 at 20, over the same six minutes of flight.
#
# Two things that fixes, both measured. A terminal reward 7,200 steps out is
# worth gamma**7200 at the episode's start -- 2e-16 at gamma 0.995, zero in
# float32 -- so the dock bonus is not merely small, it is absent, and holding
# station is the correct answer to the reward the policy can see. And per-step
# Gaussian exploration is uncorrelated, so the ~326-step commitment a 1 m/s
# approach needs before it turns a profit essentially never survives; at 20 it
# is 16 decisions. See baselines/rl/action_repeat.py.
#
# rl.total_timesteps, val.every_steps and checkpoint.save_freq are all in ENV
# steps regardless of this, so a run's budget and cadences mean the same thing
# at every setting.
action_repeat: 1
norm_reward: false
checkpoint:
  save_freq: 100000
# Pre-flown trajectories to seed the replay buffer before the first gradient
# step. Mirrors conf/rl/sac.yaml's block, which this config copies rather than
# inherits, per docs/baselines.md's winner-freezing convention. Off by default.
demo:
  repo_id: null
  revision: null
  split: train
  policies: null
  successful_only: false
  max_transitions: null    # null = the whole split, subject to buffer_size
  # Share of every sampled batch drawn from a demo store training never
  # overwrites. 0 keeps the plain seeded buffer, whose demo share decays.
  protected_fraction: 0.0
  # The control step the dataset was flown at. A run whose own dt is coarser
  # (or which holds actions) collapses that many demo rows into one
  # transition, so the seeded buffer speaks in the same time delta and reward
  # scale as the transitions training will add to it.
  source_dt: 0.05
  # Gradient steps regressing the actor onto the demonstrators' actions
  # before RL starts. 0 leaves the actor at its initialisation.
  bc_steps: 0
hyperparams:
  buffer_size: 1000000
  batch_size: 256
  learning_rate: 1.4104084145098998e-05
  gamma: 0.995
  tau: 0.004579110055790741
  train_freq: 8
  gradient_steps: 4  # trial value was 1 at n_envs 4; see header
  learning_starts: 20000
  policy_kwargs:
    net_arch: [64, 64]
