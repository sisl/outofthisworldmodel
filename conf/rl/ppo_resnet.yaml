# PPO on the pixel observation: the 27-wide vector with a frozen ResNet-18
# embedding of the rendered frame concatenated onto it (owm/envs/resnet_obs.py),
# read by the same MlpPolicy the vector runs use. The embedding changes the
# input width, not the algorithm.
#
#   just train-ppo rl=ppo_resnet \
#     environments=iss_numerical_ports_progress_1hz_near_render224 \
#     run_dir=runs/ppo_pixel_near
#
# Through `just`, not a bare `uv run`: the recipes export JAX_PLATFORMS=cpu and
# the render adapter name, and this mode needs both. Without the first, XLA
# initialises a backend on every visible card and pre-claims most of it, and
# the render contexts n_envs is budgeted against have nowhere to land.
#
# WHERE THIS CONFIGURATION COMES FROM. It inherits ppo_tuned, which is the
# configuration that flew the vector run to a 2.29 m closest approach from a
# 126.8 m start -- escape 0.02, no collisions, a val return of -35 against a
# -168.5 zero-thrust floor -- and it changes only what the observation forces.
#
# It does NOT come from the pixel sweeps. Those ranked 212 trials at 500k steps
# each and not one of the 26 that reached its horizon beat zero thrust, because
# 500k is under one percent of the 70M the same task took in vector mode: at
# that horizon nothing has learned yet, so the ranking is noise. Their one
# strong-looking signal -- 42 of 43 surviving PPO trials drawing a learning
# rate below 3e-5, an order of magnitude under ppo_tuned's -- is an artefact of
# the same thing. When no configuration learns, the best score goes to the one
# that moves least, and a tiny learning rate is how a policy stays where it
# started. Carrying it here would be reading a horizon limit as a result.
defaults:
  - ppo_tuned
  - _self_

obs: vector_resnet

# Sixteen, not ppo_tuned's 32. Every worker renders, and a render context takes
# a Vulkan device worth ~1.9 GB, so the env count is a GPU budget here rather
# than a CPU one: 16 workers is ~30 GB, and the eval pool spikes it by ~9.5 GB
# more while a val round runs. Measured at 247 env-steps/s against 145 at eight
# workers, so the wider count is also what makes the budget below affordable.
n_envs: 16

# The embedding runs on the card, and is named rather than following rl.device.
# PPO's learner is on the CPU -- SB3's MlpPolicy is faster there, and the pixel
# sweeps measured no throughput difference across architectures, so the learner
# is not what bounds this mode. The extractor is: a ResNet-18 forward per env
# per step costs more single-threaded on CPU than the render feeding it, and
# deferring to rl.device would put it back on the workers' CPUs and halve the
# run. Which physical card it lands on follows CUDA_VISIBLE_DEVICES, i.e.
# OWM_GPUS; the renderer chooses its own adapter and does not honour either.
obs_resnet:
  device: cuda

# Seventy million, matching the vector run that reached the 2.29 m approach.
# There is no evidence a pixel policy needs less -- a 539-wide observation is
# strictly harder to learn from than the 27-wide one -- and every budget this
# project has tried below that horizon has ended before the approach emerges.
# At the 247 steps/s measured above this is ~79 hours; ppo_tuned checkpoints
# every 2.5M, so `just resume <run_dir> extend_timesteps=<N>` picks it up if
# the answer is that it needs longer still.
total_timesteps: 70000000

hyperparams:
  # 2048 * 16 envs is the 32,768-transition rollout ppo_tuned holds at 1024 *
  # 32, which is the rollout the vector winner was tuned at. n_steps and n_envs
  # have to move together, per ppo_tuned's header, so that the advantage
  # estimator sees the same trace length rather than a shorter split of it.
  n_steps: 2048
